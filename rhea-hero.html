<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhea – Hero Banner</title>
<style>
  :root{
    --bg:#F4F4EE;          /* Hintergrund wie in der Rhea-App */
    --card:#FBFBF7;
    --ink:#1F3D33;
    --green:#5E8B6F;
    --green-soft:#E3EBE2;
    --muted:#7C8A82;
    --line:#E4E6DD;
    --pink:#D98B8B;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,Segoe UI,sans-serif}

  .hero{position:relative;min-height:100vh;overflow:hidden;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:2rem;padding:4rem 6vw}
  .hero::before{ /* weiche Lichtflecken im Seitenhintergrund */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(40vw 40vw at 80% 40%,rgba(120,170,140,.18),transparent 65%),
      radial-gradient(30vw 30vw at 95% 85%,rgba(217,139,139,.12),transparent 65%);
  }
  .eyebrow{font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);display:flex;gap:.6rem;align-items:center}
  .eyebrow i{color:var(--pink);font-style:normal}
  h1{font-size:clamp(2.6rem,6vw,5rem);line-height:1.02;letter-spacing:-.03em;margin:1.2rem 0 1rem}
  h1 span{color:var(--green)}
  .lead{color:var(--muted);font-size:1.1rem;max-width:34ch}
  .cta{display:flex;gap:.8rem;margin-top:2rem;flex-wrap:wrap}
  button{font:inherit;cursor:pointer;border-radius:999px;padding:.85rem 1.5rem;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:.25s}
  button.primary{background:var(--green);border-color:var(--green);color:#fff}
  button:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(31,61,51,.12)}

  /* ---------- 3D-Bühne ---------- */
  .stage{position:relative;height:min(78vh,680px);perspective:1200px;display:grid;place-items:center}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .aura{position:absolute;width:62%;aspect-ratio:1;border-radius:50%;filter:blur(46px);opacity:.75;
    background:conic-gradient(from 0deg,#ff9d3c,#f5e642,#45d483,#38b6ff,#8b5cff,#ff9d3c);
    animation:spin 14s linear infinite;transition:opacity .4s}
  .stage.flash .aura{opacity:1}
  .ring{position:absolute;width:74%;aspect-ratio:1;border-radius:50%;border:1px dashed rgba(94,139,111,.45);animation:spin 40s linear infinite reverse}
  .ring.r2{width:88%;border-style:solid;border-color:rgba(94,139,111,.18);animation-duration:70s}
  .floor{position:absolute;bottom:6%;width:46%;height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(31,61,51,.28),transparent);filter:blur(6px);animation:shadow 6s ease-in-out infinite}

  .bottle3d{position:relative;transform-style:preserve-3d;height:82%;aspect-ratio:.36;
    transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out}
  .bottle-inner{position:absolute;inset:0;animation:float 6s ease-in-out infinite;transform-style:preserve-3d}
  .bottle-inner img,.bottle-inner svg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 30px 40px rgba(31,61,51,.25))}
  .scan{position:absolute;left:-10%;right:-10%;height:3px;border-radius:3px;
    background:linear-gradient(90deg,transparent,#7be0b0,transparent);box-shadow:0 0 18px 4px rgba(123,224,176,.7);
    animation:scan 4.5s ease-in-out infinite;mix-blend-mode:multiply;opacity:.8}
  .level{position:absolute;left:18%;right:18%;bottom:9%;border-radius:12px;pointer-events:none;
    height:var(--lvl,62%);max-height:78%;background:linear-gradient(180deg,rgba(80,170,230,.0),rgba(80,170,230,.22));
    transition:height 1s cubic-bezier(.2,.8,.2,1)}

  /* ---------- HUD ---------- */
  .hud{position:absolute;background:rgba(251,251,247,.82);backdrop-filter:blur(10px);border:1px solid var(--line);
    border-radius:18px;padding:.9rem 1.1rem;box-shadow:0 14px 34px rgba(31,61,51,.10);transform:translateZ(60px);animation:float 7s ease-in-out infinite}
  .hud small{display:block;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem}
  .hud b{font-size:1.5rem;letter-spacing:-.02em}
  .hud::after{content:"";position:absolute;width:46px;height:1px;background:var(--green);opacity:.5;top:50%}
  .h1{top:8%;left:-2%;animation-delay:-1s}.h1::after{left:100%}
  .h2{top:40%;right:-3%;animation-delay:-3s}.h2::after{right:100%}
  .h3{bottom:12%;left:-4%;animation-delay:-2s}.h3::after{left:100%}
  .progress{display:flex;align-items:center;gap:.8rem}
  .donut{--p:38;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;
    background:conic-gradient(var(--green) calc(var(--p)*1%),var(--green-soft) 0);position:relative}
  .donut::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card)}
  .donut span{position:relative}
  .bar{height:6px;border-radius:6px;background:var(--green-soft);overflow:hidden;margin-top:.5rem;width:120px}
  .bar i{display:block;height:100%;width:62%;background:linear-gradient(90deg,#45d483,#38b6ff);border-radius:6px;transition:width 1s}

  .toast{position:absolute;bottom:-2%;right:2%;display:flex;gap:.8rem;align-items:center;max-width:320px;
    background:var(--ink);color:#fff;border-radius:18px;padding:.9rem 1.1rem;transform:translateZ(90px);
    box-shadow:0 18px 40px rgba(31,61,51,.35);transition:opacity .5s,transform .5s}
  .toast.hide{opacity:0;transform:translateZ(90px) translateY(14px)}
  .pulse{width:12px;height:12px;border-radius:50%;background:#7be0b0;flex:none;box-shadow:0 0 0 0 rgba(123,224,176,.7);animation:pulse 1.8s infinite}
  .toast p{font-size:.9rem;line-height:1.35}
  .toast p strong{display:block;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:#9fd6b9;margin-bottom:.15rem}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes float{0%,100%{transform:translateY(0) rotateZ(-1deg)}50%{transform:translateY(-14px) rotateZ(1deg)}}
  @keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.8);opacity:.6}}
  @keyframes scan{0%{top:8%;opacity:0}15%{opacity:.9}85%{opacity:.9}100%{top:88%;opacity:0}}
  @keyframes pulse{70%{box-shadow:0 0 0 14px rgba(123,224,176,0)}100%{box-shadow:0 0 0 0 rgba(123,224,176,0)}}

  @media(max-width:900px){
    .hero{grid-template-columns:1fr;padding:2.5rem 6vw}
    .stage{height:560px}.h1{left:0}.h3{left:0}.h2{right:0}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<section class="hero">
  <div class="copy">
    <div class="eyebrow"><i>✳</i> Dein täglicher Neustart</div>
    <h1>Rhea ist die beste <span>Smartflasche.</span></h1>
    <p class="lead">Hör auf deinen Körper. Wir behalten die kleinen Dinge im Blick.</p>
    <div class="cta">
      <button class="primary" id="sip">Schluck trinken 💧</button>
      <button id="remind">Erinnerung testen</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="aura"></div>
    <div class="ring"></div><div class="ring r2"></div>
    <canvas id="fx"></canvas>
    <div class="floor"></div>

    <div class="bottle3d" id="bottle">
      <div class="bottle-inner">
        <!-- Lege dein Flaschenbild (PNG mit transparentem Hintergrund) als flasche.png neben diese Datei -->
        <img src="assets/images/products/rhea-bottle-black-detail.png" alt="Rhea Smartflasche" onerror="this.style.display='none';document.getElementById('fallback').style.display='block'">
        <svg id="fallback" style="display:none" viewBox="0 0 120 330" aria-label="Rhea Smartflasche">
          <defs>
            <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff9d3c"/><stop offset=".3" stop-color="#f5e642"/><stop offset=".55" stop-color="#45d483"/><stop offset=".8" stop-color="#38b6ff"/><stop offset="1" stop-color="#8b5cff"/></linearGradient>
          </defs>
          <path d="M70 18c22-6 36 2 34 14-2 10-14 14-28 18" fill="none" stroke="#111" stroke-width="9" stroke-linecap="round"/>
          <rect x="22" y="14" width="64" height="44" rx="10" fill="#111"/>
          <rect x="14" y="58" width="92" height="220" rx="22" fill="rgba(255,255,255,.35)" stroke="#bcc8c4" stroke-width="2"/>
          <rect x="26" y="120" width="68" height="152" rx="16" fill="none" stroke="url(#g)" stroke-width="5"/>
          <rect x="10" y="276" width="100" height="38" rx="10" fill="#111"/>
          <text x="60" y="300" text-anchor="middle" font-family="serif" font-size="12" fill="#c9a86a">RHEA</text>
        </svg>
        <div class="level" id="level"></div>
        <div class="scan"></div>
      </div>
    </div>

    <div class="hud h1"><small>Tagesfortschritt</small>
      <div class="progress"><div class="donut" id="donut"><span id="pct">38%</span></div>
      <div><b id="liter">0,8 L</b><div style="font-size:.75rem;color:var(--muted)">Ziel 2,0 L</div></div></div></div>
    <div class="hud h2"><small>Füllstand</small><b id="fill">62%</b>
      <div class="bar"><i id="bar"></i></div></div>
    <div class="hud h3"><small>Wassertemperatur</small><b>18 °C</b>
      <div style="font-size:.75rem;color:var(--muted)">Perfekt zum Trinken</div></div>

    <div class="toast" id="toast"><span class="pulse"></span>
      <p><strong>Erinnerung</strong><span id="msg">Zeit für einen Schluck – Poppy freut sich!</span></p></div>
  </div>
</section>

<script>
(() => {
  const stage = document.getElementById('stage'), bottle = document.getElementById('bottle');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Maus-Parallax (3D-Neigung) + sanftes Eigen-Schwingen */
  stage.addEventListener('pointermove', e => {
    const r = stage.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    bottle.style.setProperty('--ry', (x * 28) + 'deg');
    bottle.style.setProperty('--rx', (-y * 14) + 'deg');
  });
  stage.addEventListener('pointerleave', () => { bottle.style.setProperty('--ry','0deg'); bottle.style.setProperty('--rx','0deg'); });
  if (!reduce) { let t = 0; (function idle(){ t += .012; if(!stage.matches(':hover')) bottle.style.setProperty('--ry', Math.sin(t)*14 + 'deg'); requestAnimationFrame(idle); })(); }

  /* Partikel: aufsteigende Wasserperlen */
  const cv = document.getElementById('fx'), cx = cv.getContext('2d'); let W,H,P=[];
  const size = () => { W = cv.width = cv.offsetWidth*devicePixelRatio; H = cv.height = cv.offsetHeight*devicePixelRatio; };
  size(); addEventListener('resize', size);
  const mk = () => ({x:W*(.3+Math.random()*.4), y:H*(.85+Math.random()*.1), r:(1+Math.random()*3)*devicePixelRatio, v:.3+Math.random()*.9, a:.2+Math.random()*.5, w:Math.random()*6});
  for (let i=0;i<40;i++){const p=mk();p.y=Math.random()*H;P.push(p)}
  (function loop(){
    cx.clearRect(0,0,W,H);
    P.forEach((p,i)=>{
      p.y -= p.v*devicePixelRatio; p.w += .03; p.x += Math.sin(p.w)*.4;
      if(p.y < H*.08) P[i]=mk();
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7);
      cx.fillStyle = `rgba(80,170,230,${p.a*.5})`; cx.fill();
      cx.strokeStyle = `rgba(255,255,255,${p.a})`; cx.lineWidth=1; cx.stroke();
    });
    if(!reduce) requestAnimationFrame(loop);
  })();

  /* HUD-Logik */
  let ml = 800, goal = 2000, fill = 62;
  const $ = id => document.getElementById(id);
  const render = () => {
    const p = Math.min(100, Math.round(ml/goal*100));
    $('donut').style.setProperty('--p', p); $('pct').textContent = p + '%';
    $('liter').textContent = (ml/1000).toFixed(1).replace('.',',') + ' L';
    $('fill').textContent = fill + '%'; $('bar').style.width = fill + '%';
    $('level').style.setProperty('--lvl', (fill*.78) + '%');
  };
  render();

  const msgs = [
    'Zeit für einen Schluck – Poppy freut sich!',
    'Kleine Schlucke, große Wirkung.',
    'Seit 45 Min. nichts getrunken – kurze Pause?',
    'Du bist im Tempo – weiter so!',
    'Dein Körper sagt Danke für ein Glas Wasser.'
  ];
  let mi = 0; const toast = $('toast');
  const showReminder = () => {
    toast.classList.add('hide');
    setTimeout(() => { $('msg').textContent = msgs[mi++ % msgs.length]; toast.classList.remove('hide'); }, 450);
  };
  setInterval(showReminder, 6000);
  $('remind').onclick = showReminder;

  $('sip').onclick = () => {
    ml = Math.min(goal, ml + 250); fill = Math.max(8, fill - 8);
    render(); stage.classList.add('flash'); setTimeout(()=>stage.classList.remove('flash'), 700);
    $('msg').textContent = '+250 ml eingetragen. Poppy freut sich! 🌸'; toast.classList.remove('hide');
  };
})();
</script>
</body>
</html>
